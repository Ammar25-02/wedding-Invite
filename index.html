<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4E8EA">
<meta name="description" content="You are invited to the engagement of Ammar and Atiqah - Saturday 7 November 2026, 12 PM, Melaka.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E"><title>Ammar &amp; Atiqah</title>
<style>
  :root{
    --ink:#5E3A47;
    --ink-soft:#8A6572;
    --ground:#F4E8EA;
    --paper:#F8EDEF;
    --paper-mid:#F1DFE4;
    --paper-shade:#E0C4CC;
    --interior:#C9A0AC;
    --wax:#9E3348;
    --wax-hi:#C05469;
    --wax-low:#792336;
    --gold:#C2A15F;
    --sage:#7E9070;

    --serif:'Iowan Old Style','Palatino Linotype','Book Antiqua',Palatino,Georgia,'Times New Roman',serif;
    --sans:'Optima','Gill Sans MT',Candara,'Trebuchet MS','Segoe UI',system-ui,sans-serif;

    /* one unit of viewport height — resolved to svh below where supported */
    --vh:1vh;

    /* the envelope is sized around the card — card ratio 495 x 712 */
    --env-w:min(72vw, 296px, calc(40 * var(--vh)));
    --env-h:calc(var(--env-w) * 1.34);
    --card-w:calc(var(--env-w) * 0.88);
    /* one length for both of the seal's axes: a percentage height would
       resolve against the envelope's height and come out oval */
    --seal:clamp(48px, calc(var(--env-w) * 0.17), 62px);

    /* the revealed card is sized by CSS, not measured, so a rotation or a
       collapsing mobile URL bar can never leave it mis-scaled */
    --card-ratio:0.6952;          /* 495 / 712 */
    --fit-pad-x:40px;
    --fit-pad-y:28px;
    --fit-reserve:100px;          /* keeps the card clear of the scroll cue */
  }
  @media (max-width:520px){
    :root{--fit-pad-x:18px; --fit-pad-y:14px;}
  }
  @media (max-height:520px){
    /* short and wide: height is the limiting side, so the cue needs more */
    :root{--fit-pad-y:10px; --fit-reserve:100px;}
  }
  /* svh, not dvh: the small-viewport unit doesn't change when a mobile
     toolbar collapses, so the hero never reflows (and the card never
     re-scales) while the page is being scrolled */
  @supports (height:1svh){
    :root{--vh:1svh;}
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    overflow:hidden;              /* no scrolling until the card is open */
    background:var(--ground);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  body.reading{overflow-y:auto;}
  /* The watercolour ground sits on its own fixed layer rather than using
     background-attachment:fixed, which forces a full repaint per scrolled
     frame on phones (and is unreliable on iOS). */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(58% 40% at 16% 10%, #FCF3F4 0%, rgba(252,243,244,0) 68%),
      radial-gradient(48% 36% at 88% 20%, #FAEAED 0%, rgba(250,234,237,0) 70%),
      radial-gradient(62% 46% at 82% 94%, #EEDBDF 0%, rgba(238,219,223,0) 72%),
      radial-gradient(66% 50% at 10% 88%, #F2E1E4 0%, rgba(242,225,228,0) 74%),
      var(--ground);
  }
  body::after{
    content:"";
    position:fixed; inset:0; z-index:4; pointer-events:none;
    background:radial-gradient(122% 88% at 50% 46%, rgba(94,58,71,0) 54%, rgba(94,58,71,.12) 100%);
  }

  /* width/height are required: inset:0 does not stretch a replaced element,
     so without them the canvas takes its intrinsic (backing-store) size and
     draws the petals oversized and spilling past the right edge */
  #petals{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    width:100%; height:100%;
  }

  .page{position:relative; z-index:2;}

  /* ---------- hero: the envelope, then the card ---------- */
  .hero{
    position:relative;
    min-height:100vh;
    min-height:calc(100 * var(--vh));
    display:flex; align-items:center; justify-content:center;
    /* symmetric, so the card is truly centred; the scroll cue is overlaid at
       the bottom rather than taking a slice of the box. --fit-reserve keeps
       the card short enough to clear it when height is the limiting side. */
    padding:var(--fit-pad-y) var(--fit-pad-x);
  }

  .scene{
    position:absolute;
    left:50%; bottom:calc(14 * var(--vh));
    margin-left:calc(var(--env-w) / -2);
    width:var(--env-w); height:var(--env-h);
    cursor:pointer;
  }
  .scene:focus-visible{outline:none;}
  .scene:focus-visible .seal{outline:2px solid var(--wax); outline-offset:6px;}

  .layer{
    position:absolute; inset:0;
    transition:opacity .9s ease, transform 1s cubic-bezier(.4,0,.6,1);
  }

  .pocket-back{
    z-index:1;
    border-radius:3px;
    background:linear-gradient(168deg, var(--interior) 0%, #C0959F 58%, #B78A96 100%);
    box-shadow:0 30px 54px -20px rgba(94,58,71,.44);
  }
  .pocket-back::after{ /* the interior shadow the card sits in */
    content:""; position:absolute; inset:0; border-radius:3px;
    background:linear-gradient(180deg, rgba(94,58,71,.34), rgba(94,58,71,0) 34%);
  }

  /* while sealed the card sits inside the envelope … */
  .card-wrap{
    position:absolute; z-index:2;
    left:50%; bottom:4%;
    width:var(--card-w);
    transform-origin:50% 50%;
    transform:translate(-50%,0px) scale(1);
    transition:transform 1.15s cubic-bezier(.22,.86,.26,1);
    will-change:transform;
  }
  /* The card's "still in shadow" tint is an opacity fade on an overlay, not a
     filter on the image: a filter would repaint the whole card every frame of
     the lift, which is what makes it stutter on a phone. */
  .card-shade{
    position:absolute; inset:0;
    /* lighter at the top, which is the edge clearing the envelope first */
    background:linear-gradient(180deg, rgba(94,58,71,.14), rgba(94,58,71,.44));
    transition:opacity 1.1s ease;
    pointer-events:none;
  }
  .lifted .card-shade{opacity:0;}
  /* … and once lifted the card lives in the hero's flow, sized to fit */
  .card-wrap.placed{
    /* relative, so .card-shade has something to anchor to — which means the
       sealed state's left/bottom offsets must be cleared, or the card lands
       half a hero to the right of centre */
    position:relative; z-index:auto;
    left:auto; right:auto; top:auto; bottom:auto;
    width:min(
      calc(100vw - var(--fit-pad-x) * 2),
      calc((calc(100 * var(--vh)) - var(--fit-pad-y) * 2 - var(--fit-reserve)) * var(--card-ratio))
    );
    transform:translate(0px,0px) scale(1);
  }
  .card{
    display:block; width:100%; height:auto;
    border-radius:2px;
    background:#fff;
    box-shadow:0 20px 42px -16px rgba(94,58,71,.42),
               0 3px 10px -4px rgba(94,58,71,.26);
  }

  .pocket-front{
    z-index:3;
    border-radius:3px;
    overflow:hidden;
    background:linear-gradient(166deg, var(--paper) 0%, var(--paper-mid) 52%, var(--paper-shade) 100%);
    box-shadow:0 -1px 5px rgba(94,58,71,.14),
               0 24px 44px -22px rgba(94,58,71,.32);
  }
  /* the two side flaps, folded in */
  .pocket-front::before,
  .pocket-front::after{
    content:""; position:absolute; top:0; bottom:0; width:52%;
  }
  .pocket-front::before{
    left:0; clip-path:polygon(0 0, 100% 50%, 0 100%);
    background:linear-gradient(90deg, rgba(217,183,192,.5), rgba(217,183,192,0));
  }
  .pocket-front::after{
    right:0; clip-path:polygon(100% 0, 0 50%, 100% 100%);
    background:linear-gradient(270deg, rgba(217,183,192,.5), rgba(217,183,192,0));
  }

  /* the bottom flap, which carries the monogram */
  .front-face{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    gap:.85em;
    padding-bottom:7%;
  }
  /* the flap's paper is the pseudo-element, so the triangular clip shapes the
     paper without also cutting the corners off the monogram sitting on it */
  .front-face::before{
    content:""; position:absolute; inset:0; z-index:-1;
    clip-path:polygon(0 100%, 50% 34%, 100% 100%);
    background:linear-gradient(0deg, rgba(255,255,255,.55), rgba(255,255,255,0) 62%);
  }
  .mono-mark{
    display:block;
    width:47%; max-width:150px; height:auto;
  }

  /* a hairline rule broken by a diamond — echoes the card's corner flourishes */
  .ornament{
    display:flex; align-items:center; gap:7px;
    width:44%; max-width:96px;
  }
  .ornament::before,
  .ornament::after{content:""; flex:1; height:1px;}
  .ornament::before{background:linear-gradient(90deg, rgba(194,161,95,0), rgba(194,161,95,.8));}
  .ornament::after{background:linear-gradient(270deg, rgba(194,161,95,0), rgba(194,161,95,.8));}
  .ornament i{
    width:5px; height:5px;
    border:1px solid rgba(194,161,95,.85);
    transform:rotate(45deg);
  }
  .ornament.wide{width:120px; max-width:none; margin:0 auto;}

  .env-date{
    margin:0;
    font-size:clamp(7.5px,2.6vw,9px);
    letter-spacing:.32em; text-transform:uppercase;
    color:var(--sage);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- flap ---------- */
  .flap-holder{
    z-index:5;
    perspective:1200px;
  }
  .flap{
    position:absolute; top:0; left:0;
    width:100%; height:44%;
    transform-origin:50% 0;
    transform:rotateX(0deg);
    transition:transform .95s cubic-bezier(.6,.02,.28,1);
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    background:linear-gradient(186deg, #FBF1F3 0%, var(--paper-mid) 56%, var(--paper-shade) 100%);
    filter:drop-shadow(0 7px 9px rgba(94,58,71,.18));
  }
  /* drop the filter for the duration of the swing — recomputing a drop-shadow
     on a rotating, clipped element costs a phone real frames */
  .opening .flap{filter:none;}
  .flap::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(94,58,71,.06), rgba(94,58,71,0) 48%);
  }
  .opening .flap{transform:rotateX(-172deg);}
  .flap-behind{z-index:0 !important;}

  /* ---------- wax seal ---------- */
  .seal{
    position:absolute; z-index:6;
    left:50%; top:44%;
    /* sized outright rather than via aspect-ratio, which needs Safari 15 —
       on 14.x the seal collapsed to nothing and vanished */
    width:var(--seal); height:var(--seal);
    transform:translate(-50%,-50%);
    padding:0; border:0; background:none;
    border-radius:50%;
    cursor:pointer;
  }
  .seal:focus-visible{outline:2px solid var(--wax); outline-offset:6px;}
  .seal-half{
    position:absolute; inset:0;
    border-radius:50%;
    /* fully opaque: the highlight lives on .seal-gloss so the two halves
       can overlap without compositing a visible seam */
    background:radial-gradient(118% 118% at 62% 80%, var(--wax-low) 0%, var(--wax) 56%);
    box-shadow:0 5px 10px -2px rgba(94,58,71,.5), 0 0 0 1px rgba(121,35,54,.45) inset;
    transition:transform .66s cubic-bezier(.3,.9,.4,1), opacity .66s ease;
  }
  .seal-half.l{clip-path:polygon(0 0, 53% 0, 47% 100%, 0 100%);}
  .seal-half.r{clip-path:polygon(53% 0, 100% 0, 100% 100%, 47% 100%);}
  .seal-gloss{
    position:absolute; inset:0;
    border-radius:50%;
    background:radial-gradient(38% 34% at 33% 26%, var(--wax-hi) 0%, rgba(192,84,105,0) 62%);
    transition:opacity .4s ease;
  }
  .seal-mono{
    position:absolute; inset:0;
    display:grid; place-items:center;
    font-family:var(--serif);
    font-size:clamp(12px,4vw,15px);
    color:rgba(255,228,233,.8);
    text-shadow:0 -1px 0 rgba(121,35,54,.7);
    transition:opacity .3s ease;
  }
  .seal-rim{
    position:absolute; inset:-8%;
    border-radius:48% 52% 51% 49% / 50% 48% 52% 50%;
    background:radial-gradient(closest-side, rgba(158,51,72,.45), rgba(158,51,72,0) 74%);
    transition:opacity .5s ease;
  }
  .broken .seal{pointer-events:none;}
  .broken .seal-half.l{transform:translate(-52%,30%) rotate(-40deg); opacity:0;}
  .broken .seal-half.r{transform:translate(52%,34%) rotate(36deg); opacity:0;}
  .broken .seal-mono,
  .broken .seal-gloss,
  .broken .seal-rim{opacity:0;}

  .revealed .pocket-back,
  .revealed .pocket-front,
  .revealed .flap-holder{opacity:0; transform:translateY(34px) scale(.975);}

  /* ---------- hint + scroll cue ---------- */
  .hint{
    /* svh-based: plain vh resolves against iOS's large viewport, which put
       this behind the Safari toolbar */
    position:fixed; left:0; right:0; z-index:3;
    bottom:calc(5 * var(--vh) + env(safe-area-inset-bottom, 0px));
    margin:0; text-align:center;
    font-size:10.5px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--ink-soft);
    transition:opacity .6s ease;
  }
  .hint span{display:inline-block; animation:breathe 3.4s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:.5} 50%{opacity:1}}

  .cue{
    position:absolute; left:50%;
    bottom:calc(8px + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:6px 10px;
    border:0; background:none; cursor:pointer;
    font-family:var(--sans);
    font-size:9px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0; pointer-events:none;
    transition:opacity .8s ease;
  }
  .cue.show{opacity:1; pointer-events:auto;}
  .cue:focus-visible{outline:1px solid var(--gold); outline-offset:4px;}
  .cue svg{width:13px; height:13px; animation:nudge 2.4s ease-in-out infinite;}
  @keyframes nudge{0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)}}

  /* ---------- the sections below the card ---------- */
  .details{display:none;}
  .reading .details{display:block;}

  .section{
    max-width:34rem;
    margin:0 auto;
    padding:calc(11 * var(--vh)) var(--fit-pad-x);
    text-align:center;
  }
  .eyebrow{
    margin:0 0 1.5em;
    font-size:9.5px; letter-spacing:.34em; text-transform:uppercase;
    color:var(--sage);
  }
  .section h2{
    margin:0;
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(30px,8vw,46px);
    letter-spacing:.01em;
    color:var(--ink);
    text-wrap:balance;
  }

  /* countdown — laid out like the card's own SATURDAY | 7 | AT 12 PM block */
  .clock{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:clamp(6px,3vw,20px);
    margin:0;
  }
  .clock div{display:flex; flex-direction:column; align-items:center; gap:.5em;}
  .clock dt{
    order:2;
    font-size:8.5px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--ink-soft);
    padding-top:.7em;
    border-top:1px solid rgba(194,161,95,.55);
    width:100%;
  }
  .clock dd{
    order:1; margin:0;
    font-family:var(--serif);
    font-size:clamp(34px,12vw,58px);
    line-height:1;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .arrived{
    margin:0;
    font-family:var(--serif);
    font-size:clamp(24px,7vw,38px);
    color:var(--ink);
  }

  .where-when{
    margin:1.1em 0 0;
    font-size:clamp(11px,3vw,12.5px);
    letter-spacing:.22em; text-transform:uppercase;
    color:var(--ink-soft);
    line-height:2;
    font-variant-numeric:tabular-nums;
  }
  .map-btn{
    display:inline-flex; align-items:center; gap:9px;
    margin-top:2em;
    padding:13px 22px;
    font-family:var(--sans);
    font-size:10px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--ink);
    text-decoration:none;
    background:rgba(255,255,255,.6);
    border:1px solid rgba(194,161,95,.7);
    transition:background .25s ease, border-color .25s ease, transform .25s ease;
  }
  .map-btn:hover{background:#fff; border-color:var(--gold); transform:translateY(-1px);}
  .map-btn:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  .map-btn svg{width:14px; height:14px; flex:none;}

  .foot{
    padding:0 var(--fit-pad-x) calc(9 * var(--vh));
    text-align:center;
  }
  .caption{
    margin:0 0 14px;
    font-size:clamp(8px,2.7vw,9.5px);
    letter-spacing:.3em; text-transform:uppercase;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
  }
  .caption b{color:var(--sage); font-weight:inherit;}
  .sound{
    position:fixed; z-index:11;
    top:calc(12px + env(safe-area-inset-top, 0px)); right:12px;
    width:38px; height:38px;
    display:grid; place-items:center;
    color:var(--ink-soft);
    background:rgba(255,255,255,.55);
    border:1px solid rgba(194,161,95,.5);
    border-radius:50%;
    cursor:pointer;
    opacity:0; pointer-events:none;
    transition:opacity .8s ease, background .25s ease, color .25s ease;
  }
  /* shown as soon as the music is actually playing, which may be before the
     card is opened — nobody should hear sound they cannot switch off */
  .playing .sound{opacity:1; pointer-events:auto;}
  .sound:hover{background:#fff; color:var(--ink);}
  .sound:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  .sound svg{width:17px; height:17px;}
  .sound.muted .wave{opacity:.2;}
  
  .replay{
    font-family:var(--sans);
    font-size:9.5px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--ink-soft);
    background:rgba(255,255,255,.5);
    border:1px solid rgba(194,161,95,.5);
    border-radius:999px;
    padding:8px 17px;
    cursor:pointer;
    transition:background .25s ease, color .25s ease, border-color .25s ease;
  }
  .replay:hover{background:#fff; color:var(--ink); border-color:var(--gold);}
  .replay:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  .fade-out{opacity:0 !important;}

  @media (prefers-reduced-motion:no-preference){
    /* on both, since body is the element whose overflow drives the viewport */
    html, body{scroll-behavior:smooth;}
    .reading .details{animation:rise .9s ease both;}
    @keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  }

  /* Reduced motion gets a gentler ceremony, not a missing one: everything
     still opens, but by fading rather than travelling across the screen. */
  @media (prefers-reduced-motion:reduce){
    .hint span,
    .cue svg{animation:none;}
    .seal-half{transition:opacity .55s ease !important;}
    .broken .seal-half.l,
    .broken .seal-half.r{transform:none;}
    .flap{transition:opacity .7s ease !important;}
    .opening .flap{transform:rotateX(0deg); opacity:0;}
    .layer{transition:opacity .8s ease !important;}
    .revealed .pocket-back,
    .revealed .pocket-front,
    .revealed .flap-holder{transform:none;}
    .card-wrap{transition:opacity .8s ease !important;}
    .card-wrap.fading{opacity:0;}
    .card-shade{transition:opacity .8s ease !important;}
  }
</style>

</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>
<audio id="song" src="songs.mp3" loop preload="auto"></audio>

<button class="sound" id="sound" type="button" aria-label="Mute music" aria-pressed="false">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M4 9v6h3l5 4V5L7 9H4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    <path class="wave" d="M16 9.5a3.5 3.5 0 0 1 0 5M18.5 7a7 7 0 0 1 0 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </svg>
</button>

<div class="page">
  <section class="hero" id="hero">

    <div class="scene" id="scene" role="button" tabindex="0" aria-label="Open the invitation envelope">

          <path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.3"/>
        </svg>
        Open in Google Maps
      </a>
    </section>

    <footer class="foot">
      <p class="caption">Saturday &middot; 7 November 2026 &middot; 12 PM &middot; <b>Melaka</b></p>
      <button class="replay" id="replay" type="button">Close &amp; open again</button>
    </footer>

  </div>
</div>

<!-- "tap to open", not "tap the seal": the whole envelope is the target, so the
     instruction holds even if the seal itself fails to render -->
<p class="hint" id="hint"><span>Tap to open</span></p>

<script>
(function(){
  var scene      = document.getElementById('scene');
  var flapHolder = document.getElementById('flapHolder');
  var seal       = document.getElementById('seal');
  var cardWrap   = document.getElementById('cardWrap');
  var cardImg    = document.getElementById('cardImg');
  var hero       = document.getElementById('hero');
  var hint       = document.getElementById('hint');
  var cue        = document.getElementById('cue');
  var details    = document.getElementById('details');
  var replay     = document.getElementById('replay');
  var body       = document.body;
  var song  = document.getElementById('song');
  var sound = document.getElementById('sound');
  /* where the card sits while the envelope is still sealed */
  var homeParent = cardWrap.parentNode;
  var homeNext   = cardWrap.nextSibling;

  var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var BASE  = 'translate(-50%, 0px) scale(1)';
  var RESTED = 'translate(0px, 0px) scale(1)';
  var SLIDE = 'transform 1.15s cubic-bezier(.22,.86,.26,1)';
  var LIFT  = 'transform 1.25s cubic-bezier(.24,.84,.28,1)';
  var state = 'sealed';
  var timers = [];

  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }

  function peekTransform(){
    var h = cardWrap.getBoundingClientRect().height || 400;
    return 'translate(-50%, ' + (-h * 0.42).toFixed(1) + 'px) scale(1)';
  }

  /* Move the card out of the envelope and into the hero's flow. Its resting
     size and position are pure CSS, so a later rotation or a collapsing
     mobile toolbar simply re-lays it out. */
  function place(){
    hero.appendChild(cardWrap);
    cardWrap.classList.add('placed');
    body.classList.add('revealed');
  }

  /* first / last / invert / play, so the trip into place is animated even
     though the destination is defined by the stylesheet */
  function lift(){
    var first = cardWrap.getBoundingClientRect();

    place();
    cardWrap.style.transition = 'none';
    cardWrap.style.transform = RESTED;
    var last = cardWrap.getBoundingClientRect();

    var dx = (first.left + first.width / 2) - (last.left + last.width / 2);
    var dy = (first.top + first.height / 2) - (last.top + last.height / 2);
    var s  = last.width ? first.width / last.width : 1;

    cardWrap.style.transform =
      'translate(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px) scale(' + s.toFixed(4) + ')';
    void cardWrap.offsetWidth;            // flush the inverted position

    cardWrap.style.transition = LIFT;
    cardWrap.style.transform = RESTED;
  }

  function finish(){
    state = 'open';
    body.classList.add('reading');        // the page can scroll from here
    cue.classList.add('show');
    startCountdown();
    startPetals();
  }

  function open(){
    if(state !== 'sealed') return;
    state = 'opening';
    scene.style.cursor = 'default';
    scene.classList.add('broken');
    hint.classList.add('fade-out');
    startSong();
    if(reduced){ openGently(); return; }

    later(function(){ scene.classList.add('opening'); }, 500);
    later(function(){ flapHolder.classList.add('flap-behind'); }, 940);

    later(function(){
      body.classList.add('lifted');
      cardWrap.style.transition = SLIDE;
      cardWrap.style.transform = peekTransform();
    }, 1200);

    later(function(){ lift(); }, 2400);
    /* the lift lands at 3650ms — reveal the sections and start the petals
       after it, so neither a layout pass nor a canvas loop steals its frames */
    later(finish, 3800);
  }

  /* The reduced-motion sequence: same beats, same pacing, but the card
     cross-fades into place instead of flying there. */
  function openGently(){
    later(function(){
      scene.classList.add('opening');
      flapHolder.classList.add('flap-behind');
    }, 450);

    later(function(){
      body.classList.add('lifted');
      cardWrap.classList.add('fading');
    }, 1000);

    later(function(){
      place();
      cardWrap.style.transition = 'none';
      cardWrap.style.transform = RESTED;
      void cardWrap.offsetWidth;
      cardWrap.style.transition = '';       // back to the stylesheet's fade
      cardWrap.classList.remove('fading');  // …and fades in, in place
    }, 1750);

    later(finish, 2750);
  }

  /* Try to play the moment the page opens. Browsers block audio that starts
     without a gesture, so if that attempt is refused we wait and start on the
     visitor's very first touch, key or scroll instead — whichever comes first.
     On a phone that is the tap that opens the envelope; on a desktop where the
     visitor has played media on this site before, it simply starts at once. */
  var GESTURES = ['pointerdown', 'mousedown', 'touchstart', 'keydown', 'scroll'];

  function startSong(){
    if(!song.paused) return;                  // already going
    song.volume = 0;
    var play = song.play();
    if(play && play.then){
      play.then(playing).catch(waitForGesture);
    } else {
      playing();                              // no promise: assume it took
    }
  }

  function playing(){
    body.classList.add('playing');            // reveals the mute control
    var step = 0, target = 0.7;
    var iv = setInterval(function(){
      step++;
      song.volume = Math.min(target, target * step / 45);
      if(step >= 45) clearInterval(iv);
    }, 2500 / 45);
  }

  function waitForGesture(){
    function go(){
      GESTURES.forEach(function(t){ document.removeEventListener(t, go, true); });
      startSong();
    }
    GESTURES.forEach(function(t){ document.addEventListener(t, go, true); });
  }

  sound.addEventListener('click', function(){
    song.muted = !song.muted;
    sound.classList.toggle('muted', song.muted);
    sound.setAttribute('aria-pressed', song.muted ? 'true' : 'false');
    sound.setAttribute('aria-label', song.muted ? 'Unmute music' : 'Mute music');
  });
  
  function reset(){
    timers.forEach(clearTimeout); timers = [];
    state = 'sealed';
    /* the music is the page's, not the envelope's — resealing the card is no
       reason to cut it off. The mute control is there for that. */

    /* jump to the top before sealing again, so the page isn't left scrolled
       to content that is about to be hidden */
    try{ window.scrollTo({top:0, left:0, behavior:'instant'}); }
    catch(e){ window.scrollTo(0, 0); }
    body.classList.remove('reading');
    cue.classList.remove('show');
    body.classList.remove('revealed', 'lifted');
    scene.classList.remove('opening', 'broken');
    flapHolder.classList.remove('flap-behind');
    cardWrap.classList.remove('fading', 'placed');
    stopPetals();

    homeParent.insertBefore(cardWrap, homeNext);   // back inside the envelope
    cardWrap.style.transition = 'none';
    cardWrap.style.transform = BASE;
    void cardWrap.offsetHeight;                    // flush before re-arming
    cardWrap.style.transition = reduced ? '' : SLIDE;

    scene.style.cursor = 'pointer';
    later(function(){ hint.classList.remove('fade-out'); }, 400);
    later(function(){ seal.focus({preventScroll:true}); }, 480);
  }

  scene.addEventListener('click', open);
  scene.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); }
  });
  replay.addEventListener('click', function(e){ e.stopPropagation(); reset(); });
  cue.addEventListener('click', function(){
    document.getElementById('countdown').scrollIntoView({block:'start'});
  });
  window.addEventListener('scroll', function(){
    if(window.scrollY > 40) cue.classList.remove('show');
    else if(state === 'open') cue.classList.add('show');
  });

  /* ---------- countdown ---------- */
  /* noon on 7 November 2026, Melaka time (UTC+8) — pinned to the offset so
     guests abroad see the true time remaining, not their local noon */
  var TARGET = new Date('2026-11-07T12:00:00+08:00').getTime();
  var ticking = null;
  var cd = {
    d: document.getElementById('cdD'),
    h: document.getElementById('cdH'),
    m: document.getElementById('cdM'),
    s: document.getElementById('cdS')
  };

  function pad(n){ return n < 10 ? '0' + n : String(n); }

  function tick(){
    var diff = TARGET - Date.now();
    if(diff <= 0){
      document.getElementById('clock').hidden = true;
      document.getElementById('arrived').hidden = false;
      if(ticking){ clearInterval(ticking); ticking = null; }
      return;
    }
    var t = Math.floor(diff / 1000);
    var d = Math.floor(t / 86400); t -= d * 86400;
    var h = Math.floor(t / 3600);  t -= h * 3600;
    var m = Math.floor(t / 60);    t -= m * 60;
    cd.d.textContent = String(d);
    cd.h.textContent = pad(h);
    cd.m.textContent = pad(m);
    cd.s.textContent = pad(t);
  }

  function startCountdown(){
    if(ticking) return;
    tick();
    ticking = setInterval(tick, 1000);
  }

  /* ---------- drifting petals ---------- */
  var cv  = document.getElementById('petals');
  var ctx = cv.getContext('2d');
  var petals = [], raf = null;

  function sizeCanvas(){
    var w = window.innerWidth, h = window.innerHeight;
    if(!w || !h) return;          // hidden or mid-transition: leave it alone
    /* a phone at dpr 3 would mean clearing ~3M pixels a frame for decoration;
       1.5 is plenty for soft, out-of-focus petals */
    var cap = w < 620 ? 1.5 : 2;
    var dpr = Math.min(window.devicePixelRatio || 1, cap);
    cv.width  = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeCanvas();
  window.addEventListener('resize', function(){
    sizeCanvas();
    if(raf) seed(petals.length);  // redistribute across the new size
  });

  var TINTS = ['rgba(232,196,205,', 'rgba(245,219,224,', 'rgba(212,168,180,', 'rgba(201,214,193,'];

  function seed(n){
    petals = [];
    for(var i = 0; i < n; i++){
      petals.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: 4 + Math.random() * 7,
        sp: 0.15 + Math.random() * 0.4,
        sway: 0.4 + Math.random() * 1.1,
        ph: Math.random() * Math.PI * 2,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.012,
        a: 0.28 + Math.random() * 0.38,
        tint: TINTS[i % TINTS.length]
      });
    }
  }

  function frame(t){
    var w = window.innerWidth, h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    for(var i = 0; i < petals.length; i++){
      var p = petals[i];
      p.y += p.sp;
      p.x += Math.sin((t / 2600) + p.ph) * p.sway * 0.32;
      p.rot += p.vr;
      if(p.y - p.r > h){ p.y = -p.r * 2; p.x = Math.random() * w; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r, p.r * 0.56, 0, 0, Math.PI * 2);
      ctx.fillStyle = p.tint + p.a.toFixed(2) + ')';
      ctx.fill();
      ctx.restore();
    }
    raf = requestAnimationFrame(frame);
  }

  function startPetals(){
    if(reduced || raf) return;
    seed(window.innerWidth < 620 ? 9 : 20);
    raf = requestAnimationFrame(frame);
  }
  function stopPetals(){
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) stopPetals();
    else if(state === 'open') startPetals();
  });

  if(!cardImg.complete){
    cardImg.addEventListener('load', function(){
      if(state === 'sealed') cardWrap.style.transform = BASE;
    });
  }

  startSong();          // as early as this browser will allow
})();
</script>

</body>
</html>
