<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>

    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #fff5f7, #ffeef3);
            text-align: center;
            color: #333;
        }

        .card {
            max-width: 700px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 {
            color: #d63384;
            font-size: 40px;
        }

        h2 {
            margin-top: 10px;
            font-weight: normal;
        }

        .details {
            margin-top: 30px;
            font-size: 18px;
            line-height: 1.8;
        }

        .date {
            font-size: 22px;
            font-weight: bold;
            color: #b02a5b;
        }

        .footer {
            margin-top: 30px;
            font-style: italic;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #d63384;
            color: white;
            text-decoration: none;
            border-radius: 30px;
        }

        .btn:hover {
            background: #ad216b;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Wedding Invitation</h1>
        <h2>We are getting married 💍</h2>

        <div class="details">
            <p><b>Bride:</b> Your Name</p>
            <p><b>Groom:</b> Partner Name</p>

            <p class="date">📅 25 December 2026</p>

            <p>📍 Location: Grand Ballroom, Kuala Lumpur</p>
        </div>

        <a class="btn" href="https://maps.google.com" target="_blank">
            View Location
        </a>

        <p class="footer">
            With love, we invite you to celebrate our special day ❤️
        </p>
    </div>

</body>
</html>
